[env:esp32-c3-mini-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_port = COM4
monitor_port = COM4
upload_protocol = esptool
upload_speed = 115200

; Custom ESP32-C3-MINI-1 PCB uses manual BOOT/RESET buttons.
; DTR is connected on the CP210x side but the auto-program circuit is inactive.
; Manual upload sequence:
; 1. Hold S1 / BOOT (GPIO9 to GND)
; 2. Press and release S2 / RESET (CHIP_PU to GND)
; 3. Release S1
; 4. Start upload
; 5. Press and release S2 / RESET after upload to run firmware
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset

lib_deps =
	robtillaart/PCF8574@^0.4.1
